<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>骑楼猫</title>
<style>
html, body { height: 100%; margin: 0; background: #0c1420; overflow: hidden; }
#app { position: fixed; inset: 0; overflow: hidden; background: #0c1420; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
#ui { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#boot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0c1420; transition: opacity .5s ease; z-index: 50; color: #f3e9d6; font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
#boot.done { opacity: 0; pointer-events: none; }
.boot-mark { font-weight: 900; font-size: clamp(40px, 9vw, 96px); letter-spacing: .14em; margin-right: -.14em; line-height: 1; }
.boot-sub { font-size: 13px; letter-spacing: .16em; color: #9fb3c8; }
.boot-bar { width: min(320px, 70vw); height: 2px; background: #22303f; }
.boot-bar i { display: block; height: 100%; width: 0%; background: #ffb86b; transition: width .2s ease; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="app">
  <canvas id="view" tabindex="0"></canvas>
  <div id="ui"></div>
  <div id="boot">
    <div class="boot-mark">骑楼猫</div>
    <div class="boot-sub" id="boot-msg">正在醒来</div>
    <div class="boot-bar"><i id="boot-fill"></i></div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
